name: App desktop (.exe)

# Gera o ProjetoB3.exe (PyInstaller, Windows). Ao criar uma tag "desktop-vX.Y",
# publica o .exe num Release (download gratuito e sem administrador).
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Dependências
        run: pip install -r requirements-desktop.txt pyinstaller
      - name: Gerar o .exe
        run: python desktop/construir.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoB3-windows
          path: dist/ProjetoB3.exe
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${{ github.ref_name }}" dist/ProjetoB3.exe --title "App desktop ${{ github.ref_name }}" --notes "Baixe o ProjetoB3.exe e abra. Na primeira vez, informe o endereço da API e o token (menu Conexão). Não é recomendação de investimento."
